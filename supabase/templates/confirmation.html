<!--
  Supabase Auth -> Email Templates -> "Confirm signup"
  Sent when a NEW user signs in with their email (the app uses
  signInWithOtp with shouldCreateUser: true, so first-time users get THIS
  template, not "Magic Link"). Both templates must carry the code.
  Subject: Your Hostiggo verification code

  Must contain {{ .Token }} and must NOT contain {{ .ConfirmationURL }}.
-->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#111827">
  <h2 style="margin:0 0 12px;font-size:20px">Welcome to Hostiggo</h2>
  <p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#374151">
    Enter this code on the sign-in screen to finish creating your account:
  </p>
  <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:8px;color:#0b4a6f">
    {{ .Token }}
  </p>
  <p style="margin:0;font-size:12px;line-height:1.5;color:#6b7280">
    This code expires soon. If you didn't try to sign up for Hostiggo, you can ignore this email.
  </p>
</div>
